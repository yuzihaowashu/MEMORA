  <text x="490" y="105" text-anchor="middle" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Arial, sans-serif" font-size="21" font-weight="750" fill="#51486D">
    RSS 2026 FM4RoboPlan
  </text>
</svg>
